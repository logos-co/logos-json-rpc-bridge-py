name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A release is cut from a v<version> tag, and the tag, pyproject.toml and
      # logos_bridge.__version__ must agree. A manual run must target such a tag too.
      - name: The tag matches the package version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::publish runs from a v<version> tag, not the $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          project=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module=$(python -c 'import runpy; print(runpy.run_path("src/logos_bridge/_version.py")["__version__"])')
          if [ "$GITHUB_REF_NAME" != "v$project" ] || [ "$module" != "$project" ]; then
            echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $project and __version__ $module disagree"
            exit 1
          fi
          echo "publishing logos-bridge $project"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing to PyPI; no token needed once configured on PyPI.
    # https://docs.pypi.org/trusted-publishers/
    environment:
      name: pypi
      url: https://pypi.org/project/logos-bridge/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
